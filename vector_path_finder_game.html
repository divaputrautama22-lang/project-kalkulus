
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --grass:#4a7c59;--grass2:#5a9669;--grid:#3d6b4a;
    --wall:#6b5a3e;--wall2:#8a7050;
    --sky:#87ceeb;--btn-h:44px;
    --panel:#fdf6e3;--panel-b:#e8d5a3;
  }
  body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#87ceeb 0%,#b0e0e8 40%,#7ab87a 40%,#5a9669 100%);min-height:100vh;padding:8px}
  h1{font-family:'Fredoka One',cursive;font-size:clamp(20px,4vw,32px);color:#fff;text-shadow:2px 2px 0 #2d5a1b,0 0 20px rgba(0,0,0,.3);text-align:center;margin-bottom:4px;letter-spacing:1px}
  .subtitle{text-align:center;font-size:13px;color:#e0f0d0;font-weight:700;letter-spacing:2px;margin-bottom:8px;text-shadow:1px 1px 0 #2d5a1b}
  .game-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .top-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}
  .stat-box{background:rgba(255,255,255,.92);border-radius:10px;padding:6px 10px;text-align:center;border:2px solid #c8a84b}
  .stat-box .label{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .stat-box .value{font-size:20px;font-weight:800;color:#2d5a1b;font-family:'Fredoka One',cursive}
  .level-badge{background:linear-gradient(135deg,#f5a623,#e88a00);color:#fff;padding:6px 14px;border-radius:20px;font-family:'Fredoka One',cursive;font-size:16px;text-align:center;border:2px solid #c77800;box-shadow:0 2px 0 #8a5400}

  .arena{background:rgba(0,0,0,.15);border-radius:14px;padding:10px;border:3px solid rgba(255,255,255,.3)}
  .grid-wrap{display:flex;justify-content:center}
  canvas{border-radius:8px;border:3px solid #2d5a1b;display:block;image-rendering:pixelated}

  .vector-panel{background:rgba(255,255,255,.95);border-radius:14px;padding:12px;border:2px solid var(--panel-b)}
  .vector-panel h3{font-family:'Fredoka One',cursive;font-size:14px;color:#2d5a1b;margin-bottom:8px;text-align:center}
  .btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:0 auto}
  .vbtn{height:var(--btn-h);border-radius:10px;border:none;cursor:pointer;font-family:'Fredoka One',cursive;font-size:13px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .1s,filter .1s;user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .vbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .vbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .vbtn .arrow{font-size:18px;line-height:1}
  .vbtn .coord{font-size:10px;opacity:.9}
  .btn-E{background:#3498db}.btn-N{background:#27ae60}.btn-W{background:#e74c3c}.btn-S{background:#e67e22}.btn-NE{background:#9b59b6}.btn-SW{background:#1abc9c}.btn-empty{visibility:hidden}

  .controls-bar{display:flex;gap:8px;justify-content:center}
  .ctrl-btn{padding:8px 16px;border-radius:10px;border:2px solid;cursor:pointer;font-family:'Fredoka One',cursive;font-size:13px;display:flex;align-items:center;gap:5px;transition:transform .1s,filter .1s}
  .ctrl-btn:active{transform:scale(.96)}
  .ctrl-btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-undo{background:#f0f0f0;border-color:#aaa;color:#555}
  .btn-redo{background:#e8f4fd;border-color:#3498db;color:#1a6fa0}
  .btn-reset{background:#fdf0f0;border-color:#e74c3c;color:#c0392b}

  .history-panel{background:rgba(255,255,255,.9);border-radius:10px;padding:8px 12px;font-size:12px;border:1px solid var(--panel-b);min-height:36px}
  .history-panel .hist-label{font-weight:700;color:#888;font-size:10px;letter-spacing:1px;margin-bottom:4px}
  .hist-items{display:flex;flex-wrap:wrap;gap:4px}
  .hist-chip{background:#e8f4fd;border:1px solid #3498db;border-radius:6px;padding:2px 7px;font-size:11px;color:#1a6fa0;font-weight:700}
  .hist-chip.current{background:#3498db;color:#fff}

  .level-btns{display:flex;gap:8px;justify-content:center}
  .lvl-btn{padding:6px 14px;border-radius:20px;border:2px solid;cursor:pointer;font-family:'Fredoka One',cursive;font-size:13px;transition:all .15s}
  .lvl-btn.active{background:#2d5a1b;border-color:#2d5a1b;color:#fff}
  .lvl-btn:not(.active){background:rgba(255,255,255,.8);border-color:#999;color:#555}

  .msg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
  .msg-overlay.show{opacity:1;pointer-events:all}
  .msg-box{background:#fff;border-radius:20px;padding:28px 32px;text-align:center;border:4px solid #f5a623;max-width:300px;transform:scale(.8);transition:transform .3s}
  .msg-overlay.show .msg-box{transform:scale(1)}
  .msg-box h2{font-family:'Fredoka One',cursive;font-size:28px;color:#2d5a1b;margin-bottom:8px}
  .msg-box p{color:#555;font-size:14px;margin-bottom:16px}
  .msg-box button{background:#f5a623;color:#fff;border:none;border-radius:12px;padding:10px 24px;font-family:'Fredoka One',cursive;font-size:16px;cursor:pointer;border-bottom:3px solid #c77800}
  .vector-eq{text-align:center;font-size:11px;color:#666;margin-top:4px;font-style:italic}
  .info-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#888;padding:2px 0}
</style>

<div class="game-wrap">
  <h1>⚑ Vector Path Finder</h1>
  <div class="subtitle">Reach the Flag · Kalkulus Vektor</div>

  <div class="level-btns" id="levelBtns">
    <button class="lvl-btn active" onclick="loadLevel(0)">Level 1</button>
    <button class="lvl-btn" onclick="loadLevel(1)">Level 2</button>
    <button class="lvl-btn" onclick="loadLevel(2)">Level 3</button>
  </div>

  <div class="top-bar">
    <div class="stat-box"><div class="label">Langkah</div><div class="value" id="stepCount">0</div></div>
    <div class="stat-box"><div class="label">Target</div><div class="value" id="targetPos">-</div></div>
    <div class="stat-box"><div class="label">Posisi</div><div class="value" id="currPos">-</div></div>
  </div>

  <div class="arena">
    <div class="grid-wrap"><canvas id="gameCanvas" width="460" height="400"></canvas></div>
  </div>

  <div class="vector-panel">
    <h3>Pilih Vektor Gerakan</h3>
    <div class="btn-grid">
      <div class="btn-empty"></div>
      <button class="vbtn btn-N" onclick="move(0,1)"><span class="arrow">↑</span><span class="coord">(0,1)</span></button>
      <div class="btn-empty"></div>
      <button class="vbtn btn-W" onclick="move(-1,0)"><span class="arrow">←</span><span class="coord">(-1,0)</span></button>
      <div class="btn-empty" style="visibility:visible;background:rgba(0,0,0,.06);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;font-weight:700">DPAD</div>
      <button class="vbtn btn-E" onclick="move(1,0)"><span class="arrow">→</span><span class="coord">(1,0)</span></button>
      <button class="vbtn btn-NE" onclick="move(-1,-1)"><span class="arrow">↙</span><span class="coord">(-1,-1)</span></button>
      <button class="vbtn btn-S" onclick="move(0,-1)"><span class="arrow">↓</span><span class="coord">(0,-1)</span></button>
      <button class="vbtn" style="background:#e91e8c" onclick="move(1,1)"><span class="arrow">↗</span><span class="coord">(1,1)</span></button>
    </div>
    <div class="vector-eq" id="vecEq">Posisi + Vektor = Posisi Baru</div>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn btn-undo" id="btnUndo" onclick="undoMove()" disabled>↩ Undo</button>
    <button class="ctrl-btn btn-redo" id="btnRedo" onclick="redoMove()" disabled>↪ Redo</button>
    <button class="ctrl-btn btn-reset" onclick="resetLevel()">↺ Reset</button>
  </div>

  <div class="history-panel">
    <div class="hist-label">RIWAYAT VEKTOR</div>
    <div class="hist-items" id="histItems"><span style="color:#bbb;font-size:11px">Belum ada gerakan...</span></div>
  </div>

  <div style="background:rgba(255,255,255,.85);border-radius:10px;padding:8px 12px;font-size:11px;color:#555;border:1px solid #ddd">
    <div class="info-row"><span>Vektor adalah besaran yang punya <strong>arah</strong> dan <strong>magnitude</strong></span></div>
    <div class="info-row"><span id="vecFormula" style="font-family:monospace;color:#2d5a1b">P_baru = P_lama + v⃗</span></div>
  </div>
</div>

<div class="msg-overlay" id="msgOverlay">
  <div class="msg-box">
    <div style="font-size:40px;margin-bottom:8px" id="msgEmoji">🎉</div>
    <h2 id="msgTitle">Berhasil!</h2>
    <p id="msgBody">Kamu mencapai bendera!</p>
    <button onclick="nextLevel()">Lanjut ↗</button>
  </div>
</div>

<script>
const COLS = 8, ROWS = 8;
const EMPTY=0,WALL=1,FLAG=2,PLAYER=3;

const LEVELS = [
  {
    name:"Level 1 - Lapangan Terbuka",
    grid:()=>{let g=Array.from({length:ROWS},()=>Array(COLS).fill(0));return g},
    start:[0,0], flag:[7,7], target:"(7,7)", minSteps:3
  },
  {
    name:"Level 2 - Labirin Sedang",
    grid:()=>{
      let g=Array.from({length:ROWS},()=>Array(COLS).fill(0));
      [[2,1],[2,2],[2,3],[2,4],[5,3],[5,4],[5,5],[5,6],[3,6],[4,6],[1,5],[1,6]].forEach(([c,r])=>g[r][c]=1);
      return g;
    },
    start:[0,7], flag:[7,0], target:"(7,0)", minSteps:5
  },
  {
    name:"Level 3 - Tantangan Diagonal",
    grid:()=>{
      let g=Array.from({length:ROWS},()=>Array(COLS).fill(0));
      [[1,0],[1,1],[1,2],[3,2],[3,3],[3,4],[5,4],[5,5],[5,6],[6,1],[6,2],[7,2],[2,6],[4,0],[4,1]].forEach(([c,r])=>g[r][c]=1);
      return g;
    },
    start:[0,7], flag:[7,0], target:"(7,0)", minSteps:6
  }
];

let cv, ctx, currentLevel=0, grid=[], playerPos=[], flagPos=[], steps=0;
let history=[], future=[], animFrame=null;

const CELL = 50;
const colors = {
  grass:['#4a7c59','#528f63','#3d6b4a','#4a8060'],
  wall:'#7a6040', wallTop:'#9a8060', wallSide:'#5a4020',
  flag:'#e74c3c', flagPole:'#8B4513',
  player:'#3498db', playerAcc:'#2980b9',
  path:'rgba(255,220,0,0.25)'
};

let grassPat = null;

function initCanvas(){
  cv = document.getElementById('gameCanvas');
  ctx = cv.getContext('2d');
  const w = Math.min(460, window.innerWidth - 40);
  const cellSize = Math.floor(w / COLS);
  cv.width = cellSize * COLS;
  cv.height = cellSize * ROWS;
  draw();
}

function loadLevel(idx){
  currentLevel = idx;
  document.querySelectorAll('.lvl-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  const lvl = LEVELS[idx];
  grid = lvl.grid();
  playerPos = [...lvl.start];
  flagPos = [...lvl.flag];
  grid[flagPos[1]][flagPos[0]] = FLAG;
  steps = 0;
  history = [];
  future = [];
  updateUI();
  draw();
}

function updateUI(){
  document.getElementById('stepCount').textContent = steps;
  document.getElementById('currPos').textContent = `(${playerPos[0]},${playerPos[1]})`;
  document.getElementById('targetPos').textContent = LEVELS[currentLevel].target;
  document.getElementById('btnUndo').disabled = history.length === 0;
  document.getElementById('btnRedo').disabled = future.length === 0;
  updateHistory();
}

function updateHistory(){
  const el = document.getElementById('histItems');
  if(history.length === 0){el.innerHTML='<span style="color:#bbb;font-size:11px">Belum ada gerakan...</span>';return;}
  el.innerHTML = history.map((h,i)=>`<span class="hist-chip${i===history.length-1?' current':''}">(${h.vec[0]},${h.vec[1]})</span>`).join('');
}

function getCellSize(){return cv.width/COLS}

function draw(){
  const cs = getCellSize();
  ctx.clearRect(0,0,cv.width,cv.height);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x=c*cs, y=r*cs;
      const shade = (c+r)%2===0?'#4a7c59':'#528f63';
      ctx.fillStyle = shade;
      ctx.fillRect(x,y,cs,cs);
      ctx.strokeStyle='rgba(0,0,0,.08)';
      ctx.lineWidth=0.5;
      ctx.strokeRect(x,y,cs,cs);
    }
  }

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]===WALL) drawWall(c,r,cs);
    }
  }

  history.forEach((h,i)=>{
    const alpha = 0.15 + 0.15*(i/Math.max(1,history.length-1));
    ctx.fillStyle=`rgba(255,220,80,${alpha})`;
    ctx.beginPath();
    ctx.roundRect(h.from[0]*cs+3,h.from[1]*cs+3,cs-6,cs-6,4);
    ctx.fill();
  });

  drawFlag(flagPos[0], flagPos[1], cs);
  drawPlayer(playerPos[0], playerPos[1], cs);

  drawCoords(cs);
}

function drawWall(c,r,cs){
  const x=c*cs, y=r*cs;
  ctx.fillStyle='#7a6040';
  ctx.fillRect(x+1,y+1,cs-2,cs-2);
  ctx.fillStyle='#9a8060';
  ctx.fillRect(x+2,y+2,cs-4,8);
  ctx.fillStyle='#5a4020';
  ctx.fillRect(x+cs-5,y+2,3,cs-4);
  ctx.strokeStyle='rgba(0,0,0,.2)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+1,y+1,cs-2,cs-2);
}

function drawFlag(c,r,cs){
  const x=c*cs+cs/2, y=r*cs;
  ctx.fillStyle='#8B4513';
  ctx.fillRect(x-2,y+4,4,cs-8);
  ctx.beginPath();
  ctx.moveTo(x+2,y+5);
  ctx.lineTo(x+cs/2-4,y+14);
  ctx.lineTo(x+2,y+22);
  ctx.closePath();
  ctx.fillStyle='#e74c3c';
  ctx.fill();
  ctx.shadowColor='rgba(231,76,60,.5)';
  ctx.shadowBlur=6;
  ctx.fill();
  ctx.shadowBlur=0;
}

let playerAnim = {t:0, from:[0,0], to:[0,0]};

function drawPlayer(c,r,cs){
  const x=c*cs, y=r*cs;
  const px=x+cs/2, py=y+cs*0.62;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.3)';
  ctx.shadowBlur=4;
  ctx.fillStyle='#3498db';
  ctx.beginPath();
  ctx.ellipse(px,py,cs*.28,cs*.38,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#e8c99a';
  ctx.beginPath();
  ctx.arc(px,py-cs*.28,cs*.16,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2c3e50';
  ctx.beginPath();
  ctx.arc(px-cs*.05,py-cs*.3,2,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px+cs*.05,py-cs*.3,2,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#c49a6e';
  ctx.beginPath();
  ctx.arc(px,py-cs*.44,cs*.18,Math.PI,0);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawCoords(cs){
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.font=`bold ${Math.max(8,cs*.2)}px Nunito`;
  ctx.textAlign='center';
  for(let c=0;c<COLS;c++){
    ctx.fillText(c, c*cs+cs/2, cv.height-3);
  }
  for(let r=0;r<ROWS;r++){
    ctx.fillText(ROWS-1-r, 5, r*cs+cs*.55);
  }
}

function move(dx,dy){
  const nx=playerPos[0]+dx, ny=playerPos[1]-dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return showBound();
  if(grid[ny][nx]===WALL) return showWall();

  history.push({from:[...playerPos], to:[nx,ny], vec:[dx,dy]});
  future = [];
  playerPos=[nx,ny];
  steps++;

  const fx=flagPos[0], fy=flagPos[1];
  document.getElementById('vecEq').textContent=`(${playerPos[0]-dx},${playerPos[1]+dy}) + (${dx},${dy}) = (${playerPos[0]},${playerPos[1]})`;
  document.getElementById('vecFormula').textContent=`P_baru = P_lama + v⃗ → (${playerPos[0]},${playerPos[1]})`;

  updateUI();
  draw();

  if(nx===fx && ny===fy) setTimeout(showWin,300);
}

function showBound(){
  flashCanvas('#e74c3c');
}
function showWall(){
  flashCanvas('#e67e22');
}
function flashCanvas(color){
  ctx.fillStyle=color+'44';
  ctx.fillRect(0,0,cv.width,cv.height);
  setTimeout(draw,150);
}

function undoMove(){
  if(history.length===0)return;
  const last=history.pop();
  future.push(last);
  playerPos=[...last.from];
  steps=Math.max(0,steps-1);
  updateUI();draw();
}

function redoMove(){
  if(future.length===0)return;
  const next=future.pop();
  history.push(next);
  playerPos=[...next.to];
  steps++;
  updateUI();draw();
}

function resetLevel(){
  future=[];
  loadLevel(currentLevel);
}

function showWin(){
  const lvl=LEVELS[currentLevel];
  const efficiency = steps <= lvl.minSteps ? '⭐⭐⭐ Sempurna!' : steps <= lvl.minSteps+2 ? '⭐⭐ Bagus!' : '⭐ Berhasil!';
  document.getElementById('msgEmoji').textContent='🎉';
  document.getElementById('msgTitle').textContent='Bendera Tercapai!';
  document.getElementById('msgBody').textContent=`${efficiency} Langkah: ${steps} | Target minimal: ${lvl.minSteps}`;
  document.getElementById('msgOverlay').classList.add('show');
}

function nextLevel(){
  document.getElementById('msgOverlay').classList.remove('show');
  if(currentLevel<LEVELS.length-1){
    loadLevel(currentLevel+1);
  } else {
    document.getElementById('msgEmoji').textContent='🏆';
    document.getElementById('msgTitle').textContent='Tamat!';
    document.getElementById('msgBody').textContent='Kamu menyelesaikan semua level! Kamu master vektor!';
    document.getElementById('msgOverlay').classList.add('show');
    document.querySelector('#msgOverlay button').textContent='Main Lagi';
    document.querySelector('#msgOverlay button').onclick=()=>{document.getElementById('msgOverlay').classList.remove('show');loadLevel(0)};
  }
}

window.addEventListener('keydown',e=>{
  const map={'ArrowRight':[1,0],'ArrowLeft':[-1,0],'ArrowUp':[0,1],'ArrowDown':[0,-1],'e':[1,1],'q':[-1,1],'x':[1,-1],'z':[-1,-1]};
  if(map[e.key]){e.preventDefault();move(...map[e.key]);}
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoMove();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redoMove();}
});

initCanvas();
loadLevel(0);
</script>
