<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Vector Path Finder</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY */
        body {
            background-color: #2c1a12;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a2e19;
            padding: 20px;
        }

        /* GAME CONTAINER */
        .game-container {
            width: 95%;
            max-width: 1200px;
            background: #3d2b1f;
            border: 8px solid #8b5a2b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        /* HEADER */
        .header-title {
            text-align: center;
            color: #f1c40f;
            text-shadow: 3px 3px #000;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .sub-header {
            text-align: center;
            color: #ecf0f1;
            font-size: 18px;
            margin-bottom: 25px;
        }

        /* CONTENT */
        .content-wrapper {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* PARCHMENT */
        .parchment {
            background: #f3e5ab;
            flex: 2;
            padding: 25px;
            border-radius: 8px;
            box-shadow: inset 0 0 12px #d4a76a;
            border: 4px solid #8b5a2b;
        }

        section {
            margin-bottom: 35px;
        }

        section h3 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #4a2e19;
            border-bottom: 3px solid #8b5a2b;
            display: inline-block;
            padding-bottom: 5px;
        }

        section p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* TEAM GRID */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 20px;
            justify-items: center;
        }

        /* MEMBER */
        .member {
            text-align: center;
            width: 180px;
        }

        /* PIXEL AVATAR */
        .pixel-avatar {
            width: 180px;
            height: 180px;
            background: #8b5a2b;
            border: 4px solid #4a2e19;
            margin: 0 auto 15px auto;
            box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.2);
        }

        /* MEMBER TEXT */
        .member p {
            font-size: 18px;
            line-height: 1.4;
        }

        .member strong {
            display: block;
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* PHOTO FRAME */
        .real-photo-frame {
            flex: 1;
            min-width: 280px;
            background: #fff8dc;
            padding: 15px;
            border: 5px solid #d4a76a;
            transform: rotate(2deg);
            text-align: center;
            height: fit-content;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
        }

        .photo-placeholder {
            width: 100%;
            height: 220px;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #4a2e19;
            font-size: 22px;
            color: #4a2e19;
        }

        .caption {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        /* BOTTOM MENU */
        .bottom-menu {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        button {
            background: #4a2e19;
            color: white;
            border: 3px solid #f1c40f;
            padding: 14px 35px;
            cursor: pointer;
            font-size: 20px;
            font-family: inherit;
            transition: 0.3s;
        }

        button:hover {
            background: #f1c40f;
            color: #4a2e19;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .content-wrapper {
                flex-direction: column;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }

            .member {
                width: 100%;
            }

            .header-title {
                font-size: 32px;
            }
        }
    </style>
</head>
