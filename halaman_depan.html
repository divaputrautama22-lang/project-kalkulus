<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Path Finder - Main Menu</title>
    <!-- Import Font Lilita One untuk gaya kartun yang tebal -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lilita One', cursive;
            overflow: hidden;
            
            /* Menggunakan gambar pemandangan hijau sebagai latar belakang */
            background: url('background.png') no-repeat center center;
            background-size: cover;
        }

        /* Kontainer Utama Menu */
        .menu-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* Memberikan sedikit bayangan pada area menu agar lebih terbaca */
            background: rgba(255, 255, 255, 0.15);
            padding: 50px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        /* Judul Game */
        .game-logo {
            font-size: 55px;
            color: #FFD54F; /* Kuning */
            text-align: center;
            line-height: 0.9;
            margin-bottom: 20px;
            text-transform: uppercase;
            -webkit-text-stroke: 2px #000;
            text-shadow: 0 6px 0 #000;
        }

        .game-logo span {
            color: #FFF;
            font-size: 70px;
        }

        /* Gaya Tombol Umum */
        .btn {
            width: 320px;
            height: 70px;
            border-radius: 20px;
            border: 4px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #222;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #000;
            transition: all 0.1s ease;
            text-decoration: none;
            user-select: none;
        }

        /* Efek klik tombol */
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #000;
        }

        /* Ikon Dekoratif */
        .icon-right {
            position: absolute;
            right: 20px;
            font-size: 28px;
        }

        /* Warna Tombol */
        .btn-start {
            background: linear-gradient(to bottom, #4DB6AC, #00796B);
        }
        .btn-options {
            background: linear-gradient(to bottom, #64B5F6, #1976D2);
        }
        .btn-about {
            background: linear-gradient(to bottom, #FFB74D, #F57C00);
        }

    </style>
</head>
<body>

    <div class="menu-container">
        <div class="game-logo">
            VECTOR<br><span>PATH FINDER</span>
        </div>

        <!-- Tombol Start -->
        <div class="btn btn-start">
        <a href="vector_path_finder.html">
            START
            <span class="icon-right">🧭</span>
        </a>
        </div>

        <!-- Tombol Options
        <div class="btn btn-options">
            OPTIONS
            <span class="icon-right">⚙️</span>
        </div> -->

        <!-- Tombol About -->
        <div class="btn btn-about">
        <a href="aboutus.html">
            ABOUT US
            <span class="icon-right">💡</span>
        </a>
        </div>
    </div>

</body>
</html>
